<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="170" viewBox="0 0 1000 170">
<style>
  text { font-family: 'Segoe UI', system-ui, -apple-system, Ubuntu, Helvetica, Arial, sans-serif; fill: #e6edf3; }
  .label { font: 600 12px 'JetBrains Mono', 'Fira Code', Consolas, monospace; fill: #8b949e; letter-spacing: 0.08em; }
  .value { font: 700 30px 'Segoe UI', system-ui, -apple-system, Ubuntu, Helvetica, Arial, sans-serif; }
  .title { font: 600 16px 'Segoe UI', system-ui, -apple-system, Ubuntu, Helvetica, Arial, sans-serif; }
  .muted { fill: #8b949e; font-size: 13px; }
  .mono { font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace; }
  .scan { animation: scan 7s linear infinite; }
  .cursor { animation: blink 1s steps(2) infinite; }
  @keyframes scan { from { transform: translateY(0); } to { transform: translateY(170px); } }
  @keyframes blink { to { visibility: hidden; } }
</style>

