name: Actualización Dinámica de README

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:

# ¡Esta es la línea mágica que le da permisos al bot para guardar los cambios!
permissions:
  contents: write 

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4 # Actualizado a v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4 # Actualizado a v4
        with:
          node-version: '20' # Actualizado a una versión moderna

      - name: Ejecutar script de actualización
        run: node update.js

      - name: Guardar los cambios (Commit & Push)
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add README.md
          git commit -m "Actualización automática de métricas diarias" || exit 0
          git push
